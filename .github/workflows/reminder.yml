name: Study slot-end reminders
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send slot-end reminders
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -u
          if [ -z "${TOPIC:-}" ]; then
            echo "NTFY_TOPIC が未設定のため通知をスキップしました。リポジトリの Settings > Secrets > Actions で設定してください。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          TODAY_JST=$(TZ=Asia/Tokyo date +%F)
          NOW_MIN=$(( 10#$(TZ=Asia/Tokyo date +%H) * 60 + 10#$(TZ=Asia/Tokyo date +%M) ))
          TODAY_START=$(TZ=Asia/Tokyo date -d "$TODAY_JST 00:00" +%s)
          # 確実化: 終了済みの枠はその日のうちなら何時間前でも拾う。
          # cronの遅延・スキップで15分窓を逃しても次回実行で通知される。
          # 二重送信は下のタイトル照合(ALREADY)で防ぐため、窓を広げても重複しない。

          # 注意: /json は poll=1 なしだとストリームが閉じず curl が永遠に
          # 終わらないため、必ず poll=1 を付けて即時返却させること。
          RAW_SLOTS=$(curl -sf "https://ntfy.sh/${TOPIC}-slots/json?poll=1&since=${TODAY_START}" 2>/dev/null || true)
          if [ -z "$RAW_SLOTS" ]; then
            echo "今日の時間帯データ(-slots)の配信がありません。アプリを開くと登録されます。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          MSG=$(printf '%s\n' "$RAW_SLOTS" | tail -n 1 | jq -r '.message // empty' 2>/dev/null || true)
          PAYLOAD_DATE=$(printf '%s' "$MSG" | jq -r '.date // empty' 2>/dev/null || true)
          if [ "$PAYLOAD_DATE" != "$TODAY_JST" ]; then
            echo "最新の時間帯データは ${PAYLOAD_DATE:-不明} のもので今日分ではありません。スキップしました。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          SENT=0
          while read -r slot; do
            START=$(printf '%s' "$slot" | jq -r '.start // empty')
            END=$(printf '%s' "$slot" | jq -r '.end // empty')
            if [ -z "$START" ] || [ -z "$END" ]; then
              continue
            fi
            END_MIN=$(( 10#${END%%:*} * 60 + 10#${END##*:} ))
            ELAPSED=$(( NOW_MIN - END_MIN ))
            if [ "$ELAPSED" -lt 0 ]; then
              continue
            fi
            TITLE="学習時間終了 ${END}"
            # 二重送信防止: 今日すでに同じタイトルで送っていたら送らない
            # (アプリを開いていた場合の即時通知と重複するため)
            ALREADY=$(curl -sf "https://ntfy.sh/${TOPIC}/json?poll=1&since=${TODAY_START}" 2>/dev/null \
              | jq -s --arg t "$TITLE" --argjson since "$TODAY_START" \
                '[.[] | select(.title == $t and .time >= $since)] | length' 2>/dev/null || echo 0)
            if [ "${ALREADY:-0}" != "0" ]; then
              echo "スキップ(送信済み): ${TITLE}" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            BOOKS=$(printf '%s' "$slot" | jq -r '[.books[]?] | join("、")')
            if [ -n "$BOOKS" ]; then
              BODY="${START}～${END} の空き時間が終わりました。今日の学習を記録しましたか？（${BOOKS}）"
            else
              BODY="${START}～${END} の空き時間が終わりました。今日の学習を記録しましたか？"
            fi
            if curl -sf -X POST "https://ntfy.sh/${TOPIC}" \
              -H "Title: ${TITLE}" \
              -d "${BODY}" >> "$GITHUB_STEP_SUMMARY" 2>&1; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "通知を送信しました: ${TITLE}" >> "$GITHUB_STEP_SUMMARY"
              SENT=$(( SENT + 1 ))
            else
              echo "通知の送信に失敗しました: ${TITLE}" >> "$GITHUB_STEP_SUMMARY"
            fi
          done <<EOF
          $(printf '%s' "$MSG" | jq -c '.slots[]?' 2>/dev/null || true)
          EOF

          if [ "$SENT" = "0" ]; then
            echo "今日まだ終わった時間帯はありませんでした（または送信済みです）。" >> "$GITHUB_STEP_SUMMARY"
          fi
