<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const errBox = document.getElementById('err'), metaEl = document.getElementById('meta');
const showErr = (m) => { errBox.style.display = 'block'; errBox.textContent = m; };
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfeee2);
scene.environment = new RoomEnvironment().texture;
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 1000);
camera.position.set(2.2, 1.8, 2.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.5, 0);
const loader = new GLTFLoader();
let current = null;
function fmtKB(b) { return (b / 1024).toFixed(1) + ' KB'; }
async function loadModel(cat, name) {
  if (current) { scene.remove(current); current = null; }
  metaEl.textContent = '読み込み中: ' + name;
  try {
    const url = 'Models/GLTF format/' + name;
    const gltf = await loader.loadAsync(url);
    current = gltf.scene;
    scene.add(current);
    const box = new THREE.Box3().setFromObject(current);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    controls.target.copy(center);
    const info = CATALOG[cat].find((e) => e.n === name);
    metaEl.textContent = name + ' (' + fmtKB(info.s) + ')\nsize: '
      + size.x.toFixed(2) + ' x ' + size.y.toFixed(2) + ' x ' + size.z.toFixed(2) + ' m';
    mthumb.style.display = '';
    mthumb.src = 'Side/' + name.replace(/\.glb$/, '.png');
    mthumb.alt = name + ' のSideプレビュー';
  } catch (e) { showErr('読み込み失敗: ' + name + ' (' + e.message + ')\n※ http サーバ経由で開いてください'); }
}
const catSel = document.getElementById('cat'), modelSel = document.getElementById('model');
const mthumb = document.getElementById('mthumb');
mthumb.onerror = () => { mthumb.style.display = 'none'; };
for (const c of Object.keys(CATALOG).sort()) {
  const o = document.createElement('option'); o.value = c; o.textContent = c + ' (' + CATALOG[c].length + ')'; catSel.appendChild(o);
}
function refreshModels() {
  modelSel.innerHTML = '';
  for (const e of CATALOG[catSel.value]) {
    const o = document.createElement('option'); o.value = e.n; o.textContent = e.n; modelSel.appendChild(o);
  }
  loadModel(catSel.value, modelSel.value);
}
catSel.addEventListener('change', refreshModels);
modelSel.addEventListener('change', () => loadModel(catSel.value, modelSel.value));
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
(function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); })();
catSel.value = CATALOG['tree'] ? 'tree' : Object.keys(CATALOG).sort()[0];
refreshModels();
</script>
